namespace: dicomrecv-ns

resources:
  - ../../base

patches:
  - path: svc_account_patch.yaml
    target: 
      kind: ServiceAccount
      name: dicomrecv-sa
      namespace: dicomrecv-ns

  - target:
      kind: Service
      name: dicom-recv-svc
      namespace: dicomrecv-ns
    path: service_patch.yaml

images:
  - name: IMAGE_PATH
    newName: us-central1-docker.pkg.dev/prj-d-dp/dicom-recv-svc/dicom_recv_svc-image
    newTag: ${IMAGE_TAG}

configMapGenerator:
  - name: app-config
    literals:
      - SPRING_PROFILES_ACTIVE=qa
      - KAFKA_BOOTSTRAP_SERVERS=bootstrap.eh-qa-kafka-cluster.us-central1.managedkafka.prj-d-dp.cloud.goog:9092
      - KAFKA_SECURITY_PROTOCOL=SASL_SSL
      - CONFIG_SERVER_URL=http://configserver-svc.configserver-ns.svc.gke:8888
      - DB_CONNECTOR_URL=dbconnector-svc.dbconnector-ns.svc.gke:8081

generatorOptions:
  disableNameSuffixHash: true