<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>DICOM Receiver — Monitoring Dashboard</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; margin: 2rem; color: #1a1a1a; }
        h1 { font-size: 1.4rem; }
        form.search { margin-bottom: 1rem; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 0.5rem 0.75rem; text-align: left; }
        th { background: #f2f4f7; }
        th a { color: inherit; text-decoration: none; }
        th a:hover { text-decoration: underline; }
        tr:nth-child(even) { background: #fafafa; }
        .msg { background: #e8f5e9; padding: 0.5rem 0.75rem; margin-bottom: 1rem; }
        .del { color: #b00020; }
        .empty { color: #666; font-style: italic; }
    </style>
</head>
<body>
<h1>DICOM Receiver — Monitoring Dashboard</h1>

<div class="msg" th:if="${message}" th:text="${message}"></div>

<form class="search" method="get" th:action="@{/}">
    <input type="text" name="q" th:value="${query}" placeholder="Search by File Name or Series ID"/>
    <button type="submit">Search</button>
</form>

<table>
    <thead>
    <tr>
        <th>Sr. No.</th>
        <th><a th:href="@{/(q=${query},sort='fileName',dir=(${sort == 'fileName'} ? ${nextDir} : 'asc'))}">File Name</a></th>
        <th><a th:href="@{/(q=${query},sort='seriesInstanceUid',dir=(${sort == 'seriesInstanceUid'} ? ${nextDir} : 'asc'))}">Series ID</a></th>
        <th><a th:href="@{/(q=${query},sort='sopInstanceUid',dir=(${sort == 'sopInstanceUid'} ? ${nextDir} : 'asc'))}">SOP ID</a></th>
        <th><a th:href="@{/(q=${query},sort='transactionDateTime',dir=(${sort == 'transactionDateTime'} ? ${nextDir} : 'asc'))}">Transaction Date &amp; Time</a></th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(records)}">
        <td colspan="6" class="empty">No file transfers recorded yet.</td>
    </tr>
    <tr th:each="record, iter : ${records}">
        <td th:text="${iter.count}"></td>
        <td th:text="${record.fileName}"></td>
        <td th:text="${record.seriesInstanceUid}"></td>
        <td th:text="${record.sopInstanceUid}"></td>
        <td th:text="${#temporals.format(record.transactionDateTime, 'dd-MM-yyyy HH:mm:ss')}"></td>
        <td>
            <form method="post" th:action="@{/records/{id}/delete(id=${record.id})}"
                  onsubmit="return confirm('Are you sure you want to delete this record?\n' + this.dataset.name);"
                  th:attr="data-name=${record.fileName}">
                <input type="hidden" name="q" th:value="${query}"/>
                <input type="hidden" name="sort" th:value="${sort}"/>
                <input type="hidden" name="dir" th:value="${dir}"/>
                <button type="submit" class="del">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
