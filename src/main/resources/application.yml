spring:
  application:
    name: dicom-receiver-simplified
  datasource:
    url: jdbc:h2:file:./data/db/dicomreceiver;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  thymeleaf:
    cache: false

server:
  port: 8080

app:
  watch:
    directory: ./data/incoming
    poll-interval-ms: 5000
  qr:
    enabled: true
    ae-title: DCMQRSCP
    port: 11112
    bind-address: 0.0.0.0
    # C-MOVE destinations: AE title -> host:port
    move-destinations: {}
  storage:
    type: local
    local-path: ./data/storage
    gcs-bucket: ""

management:
  endpoints:
    web:
      exposure:
        include: health,info
