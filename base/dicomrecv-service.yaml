apiVersion: v1
kind: Service
metadata:
  name: dicom-recv-svc
  namespace: dicomrecv-ns
  annotations:
    cloud.google.com/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  selector:
    app: dicom-recv-svc
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: hl7
      port: 2575
      targetPort: 2575
---
apiVersion: v1
kind: Service
metadata:
  name: dicom-recv-headless
  namespace: dicomrecv-ns
spec:
  clusterIP: None
  selector:
    app: dicom-recv-svc
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: hl7
      port: 2575
      targetPort: 2575