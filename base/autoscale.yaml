apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dicomrecv-svc-hpa
  namespace: dicomrecv-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: dicom-recv-svc
  minReplicas: 2
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70