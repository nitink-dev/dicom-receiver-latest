apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dicom-recv-svc
  namespace: dicomrecv-ns
spec:
  serviceName: dicom-recv-headless
  replicas: 2
  selector:
    matchLabels:
      app: dicom-recv-svc
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app: dicom-recv-svc
    spec:
      serviceAccountName: dicomrecv-sa
      nodeSelector:
        cloud.google.com/gke-nodepool: eh-qa-io-perf-node-pool      
      containers:
        - name: dicom-recv-svc
          image: IMAGE_PATH:__IMAGE_TAG__
          ports:
            - name: http
              containerPort: 8080
            - name: hl7
              containerPort: 2575
          resources:
            requests:
              cpu: 1500m
              memory: 2Gi
            limits:
              cpu: 2500m
              memory: 4Gi

          envFrom:
            - configMapRef:
                name: app-config

          env:
            - name: JAVA_TOOL_OPTIONS
              value: >
                -XX:MaxRAMPercentage=50.0
                -XX:InitialRAMPercentage=50.0
                -XX:+UseContainerSupport
                -Dsun.net.http.allowRestrictedHeaders=true
                -Dcom.google.api.client.http.HttpTransport=true
          volumeMounts:
            - name: received
              mountPath: /opt/received
 
  volumeClaimTemplates:
    - metadata:
        name: received
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: premium-rwo
        resources:
          requests:
            storage: 100Gi